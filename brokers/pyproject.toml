[project]
name = "scaralpha-brokers"
version = "0.1.0"
description = "Broker gateway for Scar Alpha: one HTTP/WS surface over Quotex and Binolla."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "websockets>=12.0",
    "httpx>=0.27",
    # Real WebSocket transport for Quotex. The vendored client ships an HTTP-polling
    # transport only; this is what replaces it.
    "websocket-client>=1.7",
    # SOCKS5. websocket-client needs PySocks to speak it, and httpx needs socksio for the
    # stickiness check — without them a socks5:// proxy fails as an import error at the
    # worst moment rather than at install.
    "PySocks>=1.7",
    "httpx[socks]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "anyio>=4.0"]

# Named explicitly rather than auto-discovered. At runtime this directory also holds
# `var/` (the candle cache), `logs/` and `vendor/` (the cloned Quotex client), and
# setuptools refuses to guess which of those is the package — so a reinstall on a server
# that had ever run failed, while the same command worked on a clean checkout.
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["var*", "logs*", "vendor*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
